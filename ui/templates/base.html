{% load static %}<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}tri-offres{% endblock %}</title>
  <meta name="theme-color" content="#ffffff">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{% static 'ui/css/tri.css' %}">
  <script src="{% static 'ui/js/tri.js' %}" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="masthead">
    <div class="masthead__inner">
      <a class="wordmark" href="/"><span class="wordmark__tabs" aria-hidden="true"><span></span><span></span><span></span></span>tri-offres</a>
      <div class="masthead__aside">{% block masthead_aside %}{% endblock %}</div>
    </div>
  </header>
  <main id="contenu" tabindex="-1">
    <div class="page">{% block content %}{% endblock %}</div>
  </main>
  <footer class="footer">
    <div class="footer__inner">
      <span>tri-offres{% if beta %}, bêta gratuite{% endif %}</span>
      <a href="{% url 'accounts:privacy' %}">Confidentialité</a>
      <a href="{% url 'accounts:legal' %}">Mentions légales</a>
    </div>
  </footer>
</body>
</html>
