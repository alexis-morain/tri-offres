{% load ui %}{% gauge_notches as notches %}
<p class="gauge{% if extra_class %} {{ extra_class }}{% endif %}">
  <span class="gauge__notches" aria-hidden="true">
    {% for notch in notches %}<span class="gauge__notch{% if notch <= score %} gauge__notch--on{% endif %}"></span>
    {% endfor %}
  </span>
  <span class="gauge__value">{{ score }} sur {{ notches|length }}</span>
</p>
